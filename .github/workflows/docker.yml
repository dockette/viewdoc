name: "Docker"

on:
  workflow_dispatch:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test (${{ matrix.variant }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: control-center
            dockerfile: Dockerfile
          - variant: viewer-kasm
            dockerfile: .docker/kasm/Dockerfile
          - variant: viewer-webtop
            dockerfile: .docker/webtop/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: dockette/viewdoc:${{ matrix.variant }}-test
          platforms: linux/amd64
          load: true

  build:
    name: "Build (${{ matrix.variant }})"
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: control-center
            dockerfile: Dockerfile
          - variant: viewer-kasm
            dockerfile: .docker/kasm/Dockerfile
          - variant: viewer-webtop
            dockerfile: .docker/webtop/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: dockette/viewdoc:${{ matrix.variant }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha
