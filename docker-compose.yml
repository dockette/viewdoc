x-kasm: &kasm
  image: dockette/viewdoc:viewer-kasm
  shm_size: "512m"
  environment:
    # VNC_PW seeds ~/.kasmpasswd (the entrypoint requires the file exists);
    # VNCOPTIONS=-disableBasicAuth tells KasmVNC to skip the basic-auth
    # challenge so the iframe loads without a browser prompt. KasmVNC has
    # no kasmvnc.yaml toggle for this and no ?password= URL mechanism — the
    # CLI flag is the only supported path.
    VNC_PW: "viewdoc"
    VNCOPTIONS: "-disableBasicAuth"
  networks: [viewdoc]
  restart: unless-stopped

x-webtop: &webtop
  image: dockette/viewdoc:viewer-webtop
  shm_size: "512m"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: "Etc/UTC"
  networks: [viewdoc]
  restart: unless-stopped

services:
  control-center:
    build:
      context: .
      dockerfile: Dockerfile
      args: &version
        VERSION: ${VIEWDOC_VERSION:-dev}
    image: dockette/viewdoc:control-center
    environment:
      # Kasm runs KasmVNC on :6901 (https, self-signed; proxy skips verify).
      # Webtop runs nginx + kclient on :3000 (plain http). Webtop's kclient
      # requires a secure context (HTTPS or localhost) — the proxy patches
      # the JS at response time to bypass the check (see internal/proxy/proxy.go).
      VIEWER_SLOTS: "kasm://viewer-kasm-1,kasm://viewer-kasm-2,webtop://viewer-webtop-1,webtop://viewer-webtop-2"
      TLS_ADDR: ":8443"
      # TLS cert source (README → TLS certificate). Default: the pre-generated
      # self-signed cert embedded in the image.
      #   On-demand, kept in the certs volume across restarts:
      #     TLS_CERT: "generate"
      #     TLS_CERT_DIR: "/certs"
      #     TLS_HOSTS: "viewdoc.lan,192.168.1.10"
      #   Your own cert (mount it, e.g. ./tls:/tls:ro):
      #     TLS_CERT: "file"
      #     TLS_CERT_FILE: "/tls/fullchain.pem"
      #     TLS_KEY_FILE: "/tls/privkey.pem"
    volumes:
      - certs:/certs
    ports:
      - "8080:8080"
      - "8443:8443"
      # No per-slot ports — slots are mounted same-origin at /slot/{i}/ on
      # the main listener, which is what makes iframe audio work.
    depends_on:
      - viewer-kasm-1
      - viewer-kasm-2
      - viewer-webtop-1
      - viewer-webtop-2
    networks: [viewdoc]
    restart: unless-stopped

  # Each viewer image is built once, by its first replica; the second reuses
  # it (pull_policy: never keeps compose from fetching the published tag from
  # Docker Hub in its place). Shared settings live in x-kasm / x-webtop.
  viewer-kasm-1:
    <<: *kasm
    build:
      context: .
      dockerfile: .docker/kasm/Dockerfile
      args: *version

  viewer-kasm-2:
    <<: *kasm
    pull_policy: never

  viewer-webtop-1:
    <<: *webtop
    build:
      context: .
      dockerfile: .docker/webtop/Dockerfile
      args: *version

  viewer-webtop-2:
    <<: *webtop
    pull_policy: never

networks:
  viewdoc:

volumes:
  certs:
