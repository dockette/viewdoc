<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>viewdoc — control center</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark">▮</span><span>viewdoc</span></div>
    <nav id="slot-tabs"></nav>
    <form id="url-form">
      <input id="url-input" type="url" placeholder="https://example.com/file.pdf" autocomplete="off" spellcheck="false">
      <button type="submit">Open</button>
      <button id="url-reset" type="button" class="danger">Reset</button>
    </form>
  </header>
  <main id="viewer"></main>
  <script src="/app.js"></script>
</body>
</html>
